name: V2 platform

# Checks for the V2 platform (platform/) and the V2 reference site (v2/).
# The production app keeps its own workflow (ci.yml).
on:
  pull_request:
    paths: ["platform/**", "v2/**", ".github/workflows/v2.yml", ".nvmrc"]
  push:
    branches: [main]
    paths: ["platform/**", "v2/**", ".github/workflows/v2.yml", ".nvmrc"]

permissions:
  contents: read

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platform

jobs:
  checks:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level moderate

  site:
    name: Build, e2e, visual, SEO parity, Lighthouse
    runs-on: ubuntu-latest
    env:
      # Deterministic input for e2e and visual regression (docs/design-system.md).
      # Real builds on Netlify read Sanity instead (apps/web/netlify.toml).
      CONTENT_SOURCE: sample
      BUILD_NOW: "2026-11-01T12:00:00+01:00"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and visual regression
        run: pnpm e2e
      - name: SEO and LLM parity
        run: |
          node tools/serve-dist.mjs 4321 &
          npx --yes wait-on@8.0.3 --timeout 30000 http://localhost:4321
          node tools/seo/compare.mjs --base http://localhost:4321 --report seo-report.json
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-reports
          path: |
            platform/playwright-report
            platform/test-results
            platform/seo-report.json
            platform/.lighthouseci
          retention-days: 14
          if-no-files-found: ignore

  reference:
    name: v2/ reference site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: v2/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
