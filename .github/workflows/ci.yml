name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # Runs before anything installs or executes: `pnpm install` runs lifecycle
  # scripts, which is exactly what triggers the EtherHiding payload if a
  # compromised workstation re-injects it (see scripts/scan-etherhiding.sh).
  malware-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Scan for EtherHiding loader signatures
        run: bash scripts/scan-etherhiding.sh

  ci:
    needs: malware-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      # - name: Test  Minimal tests with playwright to be added later
      #   run: pnpm test
