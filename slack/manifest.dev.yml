# The ZurichJS Bot for local development (docs/v2/AUTOMATION.md, "Try it locally"). Same scopes and
# events as slack/manifest.yml, but in Socket Mode: Slack sends events over a socket that
# tools/slack-dev.mjs opens from your machine, so no public URL is needed and the production bot
# is untouched. Create it at api.slack.com/apps › Create New App › From a manifest, then add an
# app-level token with the connections:write scope (Basic Information › App-Level Tokens).
display_information:
  name: ZurichJS Bot (dev)
  description: Local development copy of the ZurichJS Bot. Talks to someone's laptop, not zurichjs.com.
  background_color: '#000000'
features:
  bot_user:
    display_name: ZurichJS Bot (dev)
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - groups:history
      - channels:history
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
