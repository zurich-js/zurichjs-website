name: Claude review

# Reviews V2 pull requests against the brand rules, docs/design-system.md and the SEO
# rules. Needs the ANTHROPIC_API_KEY repository secret; without it the job passes
# with a notice, so CI never goes red for a missing key.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      ["platform/**", "v2/**", "docs/v2/**", "docs/design-system.md", "CLAUDE.md", ".claude/**"]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check for the API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the Claude review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - if: steps.key.outputs.ok == 'true'
        uses: anthropics/claude-code-action@18bb01f132748aac392d2992354fa598d28ada76 # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read CLAUDE.md (if present), docs/design-system.md and docs/v2/SEO-BASELINE.md first.

            Check the diff for:
            - bugs and regressions, including missing tests for changed behaviour
            - the brand rules: black opening and footer, white content, Figtree only, #F1E271 as the only
              accent, rounded pills and 24px cards, no kickers, no decorative borders or dividers, no talk
              recordings or slides, rating and award in one sentence without "/5"
            - SEO and LLM parity: titles, descriptions, canonical URLs, JSON-LD, sitemap, robots.txt, llms.txt
            - accessibility: labels, focus, contrast, keyboard use

            Post findings as inline review comments on the changed lines, most severe first.
            Do not comment on formatting the linters already enforce. If there is nothing worth raising,
            post one short comment saying so.
          claude_args: "--max-turns 30"
