name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level moderate

  site:
    name: Build, e2e, visual, SEO parity, Lighthouse
    runs-on: ubuntu-latest
    env:
      # Deterministic input for e2e and visual regression (docs/design-system.md).
      # Real builds on Netlify read Sanity instead (apps/web/netlify.toml).
      CONTENT_SOURCE: sample
      BUILD_NOW: '2026-11-01T12:00:00+01:00'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and visual regression
        run: pnpm e2e
      - name: Visual diff summary
        if: failure()
        run: |
          python3 -m pip install --quiet pillow==11.3.0
          python3 tools/ci/visual-diff-summary.py test-results --crops
      - name: SEO and LLM parity
        run: |
          node tools/serve-dist.mjs 4321 &
          npx --yes wait-on@8.0.3 --timeout 30000 http://localhost:4321
          node tools/seo/compare.mjs --base http://localhost:4321 --report seo-report.json
      - name: Lighthouse (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            playwright-report
            test-results
            seo-report.json
            .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
