# Netlify config for the V2 Astro site (docs/v2/RUNBOOK.md).
#
# Read only by a Netlify site whose Base directory is `platform/apps/web` (no Package
# directory): every path below is relative to that folder, and pnpm installs the whole
# `platform` workspace from there. Checked with @netlify/config's resolveConfig: with
# Base `platform` + Package `apps/web` the publish and functions paths would resolve
# against `platform/` instead. The production site keeps its UI settings until the
# switchover; there is deliberately no netlify.toml at the repository root.

[build]
command = "pnpm --filter @zurichjs/web build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.23.1"
# Production builds must read Sanity; a build that would fall back to sample content fails instead.
CONTENT_REQUIRE_SANITY = "1"

# Deploy previews and branch deploys may fall back to sample content (with a warning) when Sanity is down.
[context.deploy-preview.environment]
CONTENT_REQUIRE_SANITY = "0"
[context.branch-deploy.environment]
CONTENT_REQUIRE_SANITY = "0"

# The scheduled rebuild (every 2 minutes). The webhook is an Astro endpoint, /api/rebuild.
[functions]
directory = "netlify/functions"

# Production OG image URLs (cached by social networks) → static images generated at build.
[[redirects]]
from = "/api/og/home"
to = "/og/home.png"
status = 301
[[redirects]]
from = "/api/og/cfp"
to = "/og/cfp.png"
status = 301
[[redirects]]
from = "/api/og/cfv"
to = "/og/cfv.png"
status = 301
[[redirects]]
from = "/api/og/contact"
to = "/og/contact.png"
status = 301
[[redirects]]
from = "/api/og/partnerships"
to = "/og/partners.png"
status = 301
[[redirects]]
from = "/api/og/speakers"
to = "/og/speakers.png"
status = 301
[[redirects]]
from = "/api/og/support"
to = "/og/donate.png"
status = 301

# Fingerprinted assets (scripts, styles, the self-hosted Figtree) never change.
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Machine-read files change with every build.
[[headers]]
for = "/state-changes.json"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# Same security headers as the production next.config.mjs (Netlify adds HSTS on HTTPS itself).
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
