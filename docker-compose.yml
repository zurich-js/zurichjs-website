# Local development for zurichjs.com: the site and everything it talks to, on your machine.
#
#   just up                                site, database, Mailpit, Stripe test mode, the Slack bridge
#   just studio                            … plus the Sanity Studio
#   just logs                              follow the logs
#   just down                              stop (the database keeps its data)
#   just reset                             stop and delete the local database and installs
#
#   http://localhost:4321                  the site (membership on: /membership, /membership/account)
#   http://localhost:8025                  Mailpit: every email the site sends (sign-in links, certificates)
#   localhost:1025                         Mailpit's SMTP, for anything else you want to test locally
#   http://localhost:3333                  Sanity Studio (profile `studio`; sign in with your Sanity account)
#   http://localhost:4321/admin            admin area (ADMIN_PASSWORD, else local-admin-password-docker)
#   localhost:54322                        Postgres (user postgres, password postgres, database zurichjs)
#
# The recipes are in the justfile. `just up` is `varlock run -- docker compose up -d --wait`: varlock
# reads .env.schema, .env and .env.local, resolves 1Password references on your machine, checks every
# value, and hands the result to Compose. Nothing is written to disk and the containers never see
# 1Password. Plain `docker compose up` has no values, so the Stripe services stop with a message.
# Payments use Stripe's test mode (a sandbox; nothing is charged). Nothing here reaches Resend.
# Details: docs/systems/local-development.md.

name: zurichjs

x-node: &node
  image: node:22.23.4-bookworm-slim
  working_dir: /app
  environment: &node-env
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    # "localhost" resolves to ::1 first in the container, and Netlify's functions emulation listens
    # on one address and connects on the other (every function answered 500 ECONNREFUSED).
    NODE_OPTIONS: --dns-result-order=ipv4first
    # Keep pnpm's store in its volume: by default pnpm puts it next to the project when the project is
    # on another filesystem, which here is a 1 GB .pnpm-store folder in your checkout.
    pnpm_config_store_dir: /root/.local/share/pnpm/store
  volumes:
    - .:/app
    - pnpm-store:/root/.local/share/pnpm
    - stripe-run:/run/stripe:ro
    # Linux installs stay in the container; your own node_modules (e.g. macOS) are not used.
    # One volume per workspace package: a new package needs a line here and under `volumes:` below.
    - nm-root:/app/node_modules
    - nm-web:/app/apps/web/node_modules
    - nm-studio:/app/apps/studio/node_modules
    - nm-agent:/app/packages/agent/node_modules
    - nm-config:/app/packages/config/node_modules
    - nm-content:/app/packages/content/node_modules
    - nm-design:/app/packages/design/node_modules
    - nm-emails:/app/packages/emails/node_modules
    - nm-events:/app/packages/events/node_modules
    - nm-forms:/app/packages/forms/node_modules
    - nm-integrations:/app/packages/integrations/node_modules
    - nm-membership:/app/packages/membership/node_modules
    - nm-seo:/app/packages/seo/node_modules
    - nm-sponsorship:/app/packages/sponsorship/node_modules

x-stripe: &stripe
  image: stripe/stripe-cli:v1.55.13
  environment:
    STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zurichjs
    ports:
      - '54322:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zurichjs']
      interval: 2s
      timeout: 3s
      retries: 30

  # Mailpit (https://mailpit.axllent.org) catches every email the site sends (MAILPIT_URL below); nothing leaves your machine.
  # The inbox is kept in the mail-data volume, so it survives restarts; `docker compose down -v` clears it.
  mail:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '1000'
    ports:
      - '8025:8025'
      - '1025:1025'
    volumes:
      - mail-data:/data

  # Asks Stripe for the listener's signing secret, leaves it where `web` reads it, and exits.
  stripe-secret:
    <<: *stripe
    entrypoint:
      - sh
      - -c
      - |
        : "$${STRIPE_API_KEY:?No STRIPE_SECRET_KEY. Start the stack with `just up`, which resolves it from .env.local}"
        stripe listen --print-secret > /run/stripe/webhook-secret
    volumes:
      - stripe-run:/run/stripe
    restart: 'no'

  web:
    <<: *node
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      stripe-secret:
        condition: service_completed_successfully
    # Before the site starts, the database is migrated by the script every Netlify build runs
    # (apps/web/scripts/db-migrate.mjs), here against the local Postgres, and the partners table is
    # filled from the list in code (apps/web/scripts/seed-partners.ts: it only adds what is missing).
    # Astro's dev lock (.astro/dev.json) lives in the bind mount, so one left by a previous container is always stale here.
    command:
      - sh
      - -c
      - |
        export STRIPE_WEBHOOK_SECRET="$$(cat /run/stripe/webhook-secret)"
        corepack enable && pnpm install --frozen-lockfile &&
          DATABASE_URL="$$MEMBERSHIP_DB_URL" node apps/web/scripts/db-migrate.mjs &&
          pnpm -s partners:seed &&
          rm -f apps/web/.astro/dev.json &&
          exec pnpm --filter @zurichjs/web exec astro dev --host 0.0.0.0 --port 4321
    environment:
      <<: *node-env
      # Set here: the local services.
      MEMBERSHIP_DB_URL: postgres://postgres:postgres@db:5432/zurichjs
      BETTER_AUTH_URL: http://localhost:4321
      BETTER_AUTH_SECRET: local-docker-only-secret-not-for-production
      MAILPIT_URL: http://mail:8025
      # Marks every Slack notification the site sends as `[local]`.
      SLACK_ENV_LABEL: local
      # Yours when set (.env.local), else a local default.
      CONTENT_SOURCE: ${CONTENT_SOURCE:-sample}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-docker}
      # Passed through when set: every other name in .env.schema (tools/env-schema.test.ts fails when
      # one is missing here).
      STRIPE_SECRET_KEY:
      STRIPE_MEMBER_PORTAL_CONFIG:
      STRIPE_SPONSOR_PORTAL_CONFIG:
      STRIPE_SUPPORT_PRODUCT_ID:
      PUBLIC_STRIPE_PORTAL_URL:
      SANITY_PROJECT_ID:
      SANITY_DATASET:
      SANITY_ALLOW_PRODUCTION_WRITES:
      SANITY_TOKEN:
      SANITY_READ_TOKEN:
      SANITY_WRITE_TOKEN:
      SANITY_PERSPECTIVE:
      BUILD_NOW:
      SHOW_PREVIEW_MODULES:
      IMAGEKIT_PRIVATE_KEY:
      SANE_API_URL:
      SANE_WEB_URL:
      PUBLIC_GOOGLE_MAPS_EMBED_KEY:
      NEXT_PUBLIC_POSTHOG_KEY:
      NEXT_PUBLIC_POSTHOG_HOST:
      MEMBERSHIP_SIGNATURE_FILE:
      MEMBERSHIP_FROM:
      JWT_SECRET:
      RESEND_API_KEY:
      FORMS_TO:
      FORMS_FROM:
      EMAIL_OCTOPUS_API_KEY:
      EMAIL_OCTOPUS_LIST_ID:
      SLACK_BOT_TOKEN:
      SLACK_DEFAULT_CHANNEL:
      SLACK_WEBHOOK_URL:
      SLACK_AGENT_BOT_TOKEN:
      SLACK_SIGNING_SECRET:
      SLACK_AGENT_CHANNEL_ID:
      SLACK_PUBLISHER_IDS:
      SLACK_MEMBERSHIP_CHANNEL_ID:
      SLACK_MEMBERSHIP_APPROVER_IDS:
      SLACK_SPONSORSHIP_CHANNEL_ID:
      SLACK_APP_TOKEN:
      SLACK_CFP_BOT_TOKEN:
      SLACK_CFP_SIGNING_SECRET:
      SLACK_CFP_CHANNEL_ID:
      SLACK_CFP_APP_TOKEN:
      SANITY_AGENT_TOKEN:
      SANITY_STUDIO_URL:
      DRAFT_PREVIEW_URL:
      LLM_PROVIDER:
      LLM_MODEL:
      LLM_API_KEY:
      LLM_BASE_URL:
      CFP_LLM_MODEL:
      CFP_MAX_MODEL_CALLS_PER_DAY:
    ports:
      - '4321:4321'
    # `just up` waits for this: the first start installs the dependencies, which takes a few minutes.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4321/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15m
      start_interval: 3s

  # `stripe listen`: forwards the events production gets to the site's one webhook (memberships,
  # sponsorships, donations). It shares web's network, so 127.0.0.1:4321 is the site (astro dev listens on IPv4 only).
  stripe:
    <<: *stripe
    depends_on:
      web:
        condition: service_healthy
    network_mode: service:web
    command:
      - listen
      - --events
      - checkout.session.completed,invoice.paid,invoice.payment_failed,invoice.payment_action_required,customer.subscription.updated,customer.subscription.deleted
      - --forward-to
      - http://127.0.0.1:4321/api/stripe/webhook

  # The ZurichJS Bot (dev) and the ZurichJS CFP (dev) bot in Socket Mode (docs/systems/slack-agent.md,
  # "Try it locally"). One bridge serves both. The justfile turns this profile on when a dev app's
  # SLACK_APP_TOKEN or SLACK_CFP_APP_TOKEN is set.
  slack:
    image: node:22.23.4-bookworm-slim
    profiles: ['slack']
    depends_on:
      web:
        condition: service_healthy
    network_mode: service:web
    working_dir: /app
    volumes:
      - ./tools/slack-dev.mjs:/app/slack-dev.mjs:ro
    environment:
      SLACK_APP_TOKEN:
      SLACK_SIGNING_SECRET:
      SLACK_CFP_APP_TOKEN:
      SLACK_CFP_SIGNING_SECRET:
    command: ['node', 'slack-dev.mjs', 'http://127.0.0.1:4321']

  # The Sanity Studio against the real project (Sanity has no local backend). Sign in with your Sanity account.
  studio:
    <<: *node
    profiles: ['studio']
    depends_on:
      web:
        condition: service_started
    command: ['sh', '-c', 'corepack enable && pnpm --filter @zurichjs/studio exec sanity dev --host 0.0.0.0 --port 3333']
    ports:
      - '3333:3333'

volumes:
  db-data:
  mail-data:
  stripe-run:
  pnpm-store:
  nm-root:
  nm-web:
  nm-studio:
  nm-agent:
  nm-config:
  nm-content:
  nm-design:
  nm-emails:
  nm-events:
  nm-forms:
  nm-integrations:
  nm-membership:
  nm-seo:
  nm-sponsorship:
