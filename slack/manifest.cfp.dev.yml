# The ZurichJS CFP bot for local development (docs/v2/AUTOMATION.md, "The CFP bot"). Same scopes
# and events as slack/manifest.cfp.yml, but in Socket Mode: tools/slack-dev.mjs opens the socket
# from your machine and passes events, signed, to the local slack-cfp-* functions. Create it at
# api.slack.com/apps › Create New App › From a manifest, then add an app-level token with the
# connections:write scope (Basic Information › App-Level Tokens): that is SLACK_CFP_APP_TOKEN.
display_information:
  name: ZurichJS CFP (dev)
  description: Local development copy of the ZurichJS CFP bot. Talks to someone's laptop, not zurichjs.com.
  background_color: '#000000'
features:
  bot_user:
    display_name: ZurichJS CFP (dev)
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
