# platform/ is its own pnpm root, isolated from the production app at the repository root.
# Same supply-chain policy as the root workspace: packages must be at least 3 days old.
packages:
  - apps/*
  - packages/*

minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  sharp: true

packageExtensions:
  # @astrojs/check → astro2tsx loads @napi-rs/wasm-runtime, which imports @emnapi/runtime without declaring it.
  '@napi-rs/wasm-runtime@1':
    dependencies:
      '@emnapi/runtime': 1.11.2

overrides:
  # Security (pnpm audit / dependency review, 2026-10-31): Netlify dev tooling pulls these in.
  # glob 13 → 14 and minimatch 10 → 11 keep the same named-export API.
  glob@13: ^14.0.2
  minimatch@10: ^11.0.1
  # satori → @shuding/opentype.js pins fflate 0.7.3 (GHSA-px8p-9vwx-vf98); 0.7.5 is the same-minor fix.
  fflate@0.7: ^0.7.5
  # Security (pnpm audit, 2026-11-03): the Sanity CLI (apps/studio) pulls these in through @vercel/frameworks
  # and @sanity/workbench-cli. Each override stays within the same major, on its patched release.
  js-yaml@3: ^3.15.2
  smol-toml@1: ^1.9.1
  undici@7: ^7.30.1
  # No patched deepmerge release exists; vendor/deepmerge carries the fix (see its README).
  deepmerge: link:./vendor/deepmerge
