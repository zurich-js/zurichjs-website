# platform/ is its own pnpm root, isolated from the production app at the repository root.
# Same supply-chain policy as the root workspace: packages must be at least 3 days old.
packages:
  - apps/*
  - packages/*

minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  sharp: true

packageExtensions:
  # @astrojs/check → astro2tsx loads @napi-rs/wasm-runtime, which imports @emnapi/runtime without declaring it.
  '@napi-rs/wasm-runtime@1':
    dependencies:
      '@emnapi/runtime': 1.11.2
