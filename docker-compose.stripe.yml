# The local stack against Stripe's test mode, not the mock (pnpm local:stripe; docs/v2/RUNBOOK.md,
# "Local development"). tools/local-stripe.sh exports these variables after checking the key is a
# test-mode key, and runs `stripe listen` on your machine to forward Stripe's events to the site.

services:
  web:
    environment:
      STRIPE_API_BASE: ''
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?run pnpm local:stripe (it reads .env.local)}
      STRIPE_MEMBER_PORTAL_CONFIG: ${STRIPE_MEMBER_PORTAL_CONFIG:?set STRIPE_MEMBER_PORTAL_CONFIG in .env.local (pnpm membership:stripe-setup --apply prints it)}
      STRIPE_MEMBERSHIP_WEBHOOK_SECRET: ${STRIPE_MEMBERSHIP_WEBHOOK_SECRET:?run pnpm local:stripe (it asks stripe listen for the secret)}
      STRIPE_SUPPORT_PRODUCT_ID: ${STRIPE_SUPPORT_PRODUCT_ID:-}
